<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ti hanno prestato una tessera - FideliCard</title>
<style>
  :root {
    --bg: #121212;
    --card-bg: #1e1e1e;
    --accent: #ff9800;
    --text: #ffffff;
    --text-dim: #999999;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .wrap { width: 100%; max-width: 420px; text-align: center; }
  .app-name { color: var(--accent); font-weight: 800; font-size: 15px; letter-spacing: 0.5px; margin-bottom: 28px; }
  .card {
    border-radius: 20px;
    padding: 28px 20px;
    margin-bottom: 22px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .card-logo {
    width: 96px;
    height: 96px;
    border-radius: 16px;
    margin: 0 auto 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    font-weight: 800;
    font-size: 30px;
    color: #1e1e1e;
  }
  .brand-name { font-size: 22px; font-weight: 800; margin: 0 0 6px; }
  .from-line { font-size: 14px; opacity: 0.85; margin: 0; }
  .expiry-line { font-size: 13px; opacity: 0.7; margin: 6px 0 0; }
  .cta {
    display: block;
    width: 100%;
    padding: 16px;
    border-radius: 12px;
    background: var(--accent);
    color: #121212;
    font-weight: 800;
    font-size: 16px;
    text-decoration: none;
    margin-bottom: 14px;
  }
  .hint { font-size: 12px; color: var(--text-dim); line-height: 1.6; }
  .hint a { color: var(--accent); text-decoration: none; }
  #fallback { display: none; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="app-name">FIDELICARD</div>

    <div id="loading">
      <p class="hint">Caricamento...</p>
    </div>

    <div id="content" style="display:none">
      <div class="card" id="cardBox">
        <div class="card-logo" id="cardLogo"></div>
        <p class="brand-name" id="cardBrand"></p>
        <p class="from-line" id="cardFrom"></p>
        <p class="expiry-line" id="cardExpiry"></p>
      </div>

      <a href="#" id="openAppBtn" class="cta">Apri in FideliCard</a>

      <p class="hint" id="hintText"></p>
    </div>

    <div id="fallback">
      <p class="hint">Link non valido o incompleto. Chiedi a chi te l'ha mandato di riprovare.</p>
    </div>
  </div>

<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var nome = params.get('nome');
    var codice = params.get('codice');
    var da = params.get('da');

    if (!nome || !codice || !da) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('fallback').style.display = 'block';
      return;
    }

    var colore = params.get('colore') || '#1E1E1E';
    var scadenza = params.get('scadenza');

    document.getElementById('cardBox').style.background = colore;
    document.getElementById('cardLogo').textContent = nome.trim().slice(0, 2).toUpperCase();
    document.getElementById('cardBrand').textContent = nome;
    document.getElementById('cardFrom').textContent = 'Te la presta ' + da;

    if (scadenza) {
      var d = new Date(scadenza);
      if (!isNaN(d.getTime())) {
        var formatted = d.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' });
        document.getElementById('cardExpiry').textContent = 'Valida fino al ' + formatted;
      }
    } else {
      document.getElementById('cardExpiry').textContent = 'Senza scadenza';
    }

    // Rilancia lo stesso link ma con lo schema dell'app, per aprirla
    // direttamente se è installata.
    var appUrl = 'fidelicard://prestito?' + window.location.search.slice(1);
    document.getElementById('openAppBtn').setAttribute('href', appUrl);
    document.getElementById('hintText').textContent =
      'Se non succede nulla, installa prima FideliCard dallo store e riapri questo link.';

    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';

    // Prova ad aprire l'app in automatico appena la pagina carica.
    window.location.href = appUrl;
  })();
</script>
</body>
</html>
