<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ti hanno prestato una tessera - FideliCard</title>
<link rel="icon" type="image/png" href="assets/images/favicon.png" />
<style>
  :root {
    --bg: #121212;
    --card-bg: #1e1e1e;
    --accent: #ff9800;
    --text: #ffffff;
    --text-dim: #999999;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .wrap { width: 100%; max-width: 420px; text-align: center; }
  .app-icon { width: 64px; height: 64px; border-radius: 16px; margin-bottom: 12px; box-shadow: 0 10px 24px -8px rgba(255,110,0,0.45); }
  .app-name { color: var(--accent); font-weight: 800; font-size: 15px; letter-spacing: 0.5px; margin-bottom: 28px; }
  .card {
    border-radius: 20px;
    padding: 28px 20px;
    margin-bottom: 22px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .card-logo {
    width: 96px;
    height: 96px;
    border-radius: 16px;
    margin: 0 auto 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    font-weight: 800;
    font-size: 30px;
    color: #1e1e1e;
    overflow: hidden;
  }
  .card-logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 12px;
  }
  .brand-name { font-size: 22px; font-weight: 800; margin: 0 0 6px; }
  .from-line { font-size: 14px; opacity: 0.85; margin: 0; }
  .expiry-line { font-size: 13px; opacity: 0.7; margin: 6px 0 0; }
  .cta {
    display: block;
    width: 100%;
    padding: 16px;
    border-radius: 12px;
    background: var(--accent);
    color: #121212;
    font-weight: 800;
    font-size: 16px;
    text-decoration: none;
    margin-bottom: 14px;
  }
  .hint { font-size: 12px; color: var(--text-dim); line-height: 1.6; }
  .hint a { color: var(--accent); text-decoration: none; }
  #fallback { display: none; }
</style>
</head>
<body>
  <div class="wrap">
    <img class="app-icon" src="assets/images/icon-96.png" alt="Icona FideliCard" />
    <div class="app-name">FIDELICARD</div>

    <div id="loading">
      <p class="hint">Caricamento...</p>
    </div>

    <div id="content" style="display:none">
      <div class="card" id="cardBox">
        <div class="card-logo" id="cardLogo"></div>
        <p class="brand-name" id="cardBrand"></p>
        <p class="from-line" id="cardFrom"></p>
        <p class="expiry-line" id="cardExpiry"></p>
      </div>

      <a href="#" id="openAppBtn" class="cta">Apri in FideliCard</a>

      <p class="hint" id="hintText"></p>
    </div>

    <div id="fallback">
      <p class="hint">Link non valido o incompleto. Chiedi a chi te l'ha mandato di riprovare.</p>
      <p class="hint" style="margin-top:20px;"><a href="index.html">Scopri FideliCard</a></p>
    </div>
  </div>

<script>
  (function () {
    var LOGHI_BASE = 'https://raw.githubusercontent.com/gdixie70/fidelicard/main/assets/loghi/';

    var params = new URLSearchParams(window.location.search);
    var nome = params.get('nome');
    var codice = params.get('codice');
    var da = params.get('da');

    if (!nome || !codice || !da) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('fallback').style.display = 'block';
      return;
    }

    var colore = params.get('colore') || '#1E1E1E';
    var scadenza = params.get('scadenza');
    var logoFile = params.get('logoFile');

    document.getElementById('cardBox').style.background = colore;

    var logoEl = document.getElementById('cardLogo');
    if (logoFile) {
      // Stesso archivio pubblico dei loghi usato dall'app: se il file non
      // esiste (o siamo offline) l'onerror fa comparire le iniziali,
      // esattamente come nell'app quando il logo non è ancora disponibile.
      var img = document.createElement('img');
      img.src = LOGHI_BASE + encodeURIComponent(logoFile);
      img.alt = nome;
      img.onerror = function () {
        logoEl.textContent = nome.trim().slice(0, 2).toUpperCase();
      };
      logoEl.appendChild(img);
    } else {
      logoEl.textContent = nome.trim().slice(0, 2).toUpperCase();
    }

    document.getElementById('cardBrand').textContent = nome;
    document.getElementById('cardFrom').textContent = 'Te la presta ' + da;

    if (scadenza) {
      var d = new Date(scadenza);
      if (!isNaN(d.getTime())) {
        var formatted = d.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' });
        document.getElementById('cardExpiry').textContent = 'Valida fino al ' + formatted;
      }
    } else {
      document.getElementById('cardExpiry').textContent = 'Senza scadenza';
    }

    // Il link apre lo schema dell'app solo quando l'utente tocca il
    // bottone: niente redirect automatico, altrimenti il popup di sistema
    // "Vuoi aprire questa pagina su FideliCard?" compare subito e copre la
    // tessera prima ancora che si faccia in tempo a vederla.
    var appUrl = 'fidelicard://prestito?' + window.location.search.slice(1);
    document.getElementById('openAppBtn').setAttribute('href', appUrl);
    document.getElementById('hintText').textContent =
      'Se non hai ancora FideliCard, installala dallo store e riapri questo link.';

    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
  })();
</script>
</body>
</html>
